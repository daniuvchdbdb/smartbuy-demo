services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: smartbuy, POSTGRES_PASSWORD: smartbuy, POSTGRES_DB: smartbuy }
    ports: ["5432:5432"]
    volumes: ["smartbuy_postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    volumes: ["smartbuy_redis:/data"]
  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    environment: { DATABASE_URL: "postgresql+psycopg://smartbuy:smartbuy@postgres:5432/smartbuy", REDIS_URL: "redis://redis:6379/0", DEMO_MODE: "true" }
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
  worker:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "smartbuy"]
    environment: { DATABASE_URL: "postgresql+psycopg://smartbuy:smartbuy@postgres:5432/smartbuy", REDIS_URL: "redis://redis:6379/0", DEMO_MODE: "true" }
    depends_on: [postgres, redis]
  admin:
    build: { context: ., dockerfile: docker/admin.Dockerfile }
    environment: { NEXT_PUBLIC_API_URL: "http://127.0.0.1:8000/api/v1" }
    ports: ["3000:3000"]
    depends_on: [api]
volumes: { smartbuy_postgres: {}, smartbuy_redis: {} }
